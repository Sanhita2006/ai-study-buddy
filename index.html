<!DOCTYPE html>
<html lang="bn">
<head>
   
</head>
<!-- Tailwind CSS (স্টাইলিংয়ের জন্য) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font Awesome (আইকনের জন্য) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between font-sans">

    <!-- Header Section -->
    <header class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-graduation-cap text-indigo-400"></i> AI Study Buddy
        </h1>
        <span class="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30">
            Powered by Gemma
        </span>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 p-4 max-w-3xl w-full mx-auto overflow-y-auto space-y-4" id="chat-box">
        
        <!-- Bot Welcome Message -->
        <div class="flex gap-3">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-sm">
                AI
            </div>
            <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none max-w-[80%] border border-slate-700">
                হ্যালো! আমি তোমার AI Study Buddy 📚। আজ পড়াশোনার কী বিষয়ে সাহায্য প্রয়োজন?
            </div>
        </div>

    </main>

    <!-- Input Section -->
    <footer class="p-4 bg-slate-800 border-t border-slate-700">
        <div class="max-w-3xl mx-auto flex gap-2">
            <textarea id="user-input" rows="1" 
                placeholder="আপনার প্রশ্নটি লিখুন..." 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 focus:outline-none focus:border-indigo-500 text-sm resize-none"></textarea>
            
            <button id="send-btn" 
                class="bg-indigo-600 hover:bg-indigo-500 px-5 rounded-xl font-medium transition flex items-center justify-center gap-2">
                <span>পাঠাও</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </footer>
<script>
const chatBox = document.getElementById('chat-box');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

sendBtn.addEventListener('click', async () => {
    const text = userInput.value.trim();
    if (!text) return;

    // ১. ইউজারের মেসেজ চ্যাটবক্সে যোগ করা
    chatBox.innerHTML += `
        <div class="flex gap-3 justify-end">
            <div class="bg-indigo-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[80%]">
                ${text}
            </div>
        </div>
    `;

    userInput.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // ২. AI-এর লোডিং অ্যানিমেশন দেখানো
    const loadingId = 'loading-' + Date.now();
    chatBox.innerHTML += `
        <div class="flex gap-3" id="${loadingId}">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-sm">AI</div>
            <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-slate-400 flex items-center gap-2">
                <i class="fa-solid fa-circle-notch animate-spin"></i> উত্তর তৈরি হচ্ছে...
            </div>
        </div>
    `;

    // ৩. Gemma API-তে রিকোয়েস্ট পাঠানো এবং উত্তর বসানো (এখানে আপনার API কল হবে)
    /* 
    const response = await fetchGemmaAPI(text); 
    document.getElementById(loadingId).querySelector('div:last-child').innerText = response;
    */
});
</script>
</body>
</body>


</html>
